name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the build dependencies
        run: python3 -m pip install --upgrade pip PySide6 py2app

      # The shipped example is what a new installation gets, and it declares
      # the agents and paths the checks read. Only the home is replaced, with
      # one nothing in the tree can name, so the identity scan has a real
      # needle to look for.
      - name: Write the configuration the checks read
        run: |
          python3 - <<'PY'
          import json, pathlib, uuid
          cfg = json.loads(pathlib.Path("config/config.example.json").read_text())
          cfg["drives"]["local_home"]["path"] = f"/opt/{uuid.uuid4()}"
          pathlib.Path("config/config.local.json").write_text(
              json.dumps(cfg, indent=2) + "\n")
          PY

      - name: Build the release
        run: python3 src/tools/bristol/make_release.py

      - name: Read the version
        id: version
        run: echo "value=$(cat src/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd src/tools/bristol/dist
          gh release create "v$VERSION" \
            "BristolTickets-$VERSION.zip" \
            "BristolTickets-$VERSION.zip.sha256" \
            --title "Bristol Tickets $VERSION" \
            --notes "macOS refuses an unsigned app until it is allowed once in System Settings → Privacy & Security. docs/install.md carries the wording."
