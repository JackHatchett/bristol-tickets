name: Smoke

# Runs the code checks and unit tests pyproject.toml configures, then the smoke suite
# (src/tools/test_tools/run_smoke.sh), on Linux for every pull request and every
# push to main. The suite builds each window without a display, and the run
# fails when any check fails. It publishes nothing and writes
# nothing back to the repository.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Qt loads these system libraries even when it draws to no screen.
      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the board's dependencies and the code checks
        run: python3 -m pip install --upgrade pip PySide6 ruff==0.16.9 pyright==1.1.414 pytest==9.2.0 pytest-cov==7.1.0

      # The three code checks pyproject.toml configures; a finding fails the run.
      - name: Lint
        run: ruff check src

      - name: Check formatting
        run: ruff format --check src

      - name: Check types
        run: pyright

      # The board rules, each against a board built in a temporary folder,
      # under coverage. The run ends on one total line, and fails when the
      # share of src/tools/bristol and src/tools/ticket_tools the tests run
      # falls below the floor: 10.7%, the share when coverage was first measured.
      - name: Run the unit tests
        run: >-
          python3 -m pytest
          --cov=src/tools/bristol --cov=src/tools/ticket_tools
          --cov-report= --cov-fail-under=10.7

      # The same configuration release.yml writes: the shipped example, with
      # the home replaced by one nothing in the tree contains, so the identity
      # scan has a real needle to look for.
      - name: Write the configuration the checks read
        run: |
          python3 - <<'PY'
          import json, pathlib, uuid
          cfg = json.loads(pathlib.Path("config/config.example.json").read_text())
          cfg["drives"]["local_home"]["path"] = f"/opt/{uuid.uuid4()}"
          pathlib.Path("config/config.local.json").write_text(
              json.dumps(cfg, indent=2) + "\n")
          PY

      - name: Run the smoke suite
        run: bash src/tools/test_tools/run_smoke.sh
