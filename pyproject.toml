# Bristol's checks: ruff lints and formats, pyright checks types, pytest runs the
# unit tests. CI runs all four (.github/workflows/smoke.yml), and a finding or a
# failing test fails the run.

[tool.pytest.ini_options]
# The unit tests: the board rules, each against a board built from schema.sql in
# a temporary folder.
testpaths = ["src/tools/test_tools/unit"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Pyflakes, pycodestyle, import order, pyupgrade, bugbear, pep8-naming, and
# flake8-annotations, which the per-file ignores below hold to the app's ui/.
select = ["E", "F", "W", "I", "UP", "B", "N", "ANN", "RUF100"]
# E501: the formatter wraps code at the line length; a line it leaves longer is
# a string, a SQL statement or a URL, kept whole so it can be searched for.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Bristol Coding Standards has every parameter and return annotated in the
# app's ui/ package; the rest of src is outside that rule.
"!src/tools/bristol/ui/**" = ["ANN"]
# An Objective-C message's reply is whatever ctypes converts it to by the
# restype the call passes, so _send's restype and return are Any.
"src/tools/bristol/ui/mac_window.py" = ["ANN401"]

[tool.ruff.lint.pep8-naming]
# A Qt override keeps the name Qt calls it by. The card delegate's geometry is
# read as constants, MARGIN and PAD, though each is a property over a token.
extend-ignore-names = [
    "*Event", "sizeHint", "minimumSizeHint", "hitButton", "setText",
    "isComplete", "nextId", "validatePage", "initializePage", "eventFilter",
    "paint", "data", "flags",
    "MARGIN", "PAD", "GAP", "CHECK_W", "CHECK_BOX", "PILL_H", "FOOT_H", "DESC_H", "MARK_D",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Each tool is a script that puts its sibling folders on sys.path before it
# imports from them; these are those folders, in the order the scripts add them.
extraPaths = [
    "src/tools/config_tools",
    "src/tools/skill_tools",
    "src/tools/_shared",
    "src/tools/ticket_tools",
]
